# ---------------------------------------------------------------------------
# CI pipeline for the IP Address Information Tool (Project Activity 4)
#
# What it does:
#   Every time someone pushes a commit (to any branch) or opens/updates a
#   pull request into main, GitHub automatically:
#     1. Checks out the code on a fresh Linux machine
#     2. Installs Python and our libraries
#     3. Checks the code for errors and style problems (flake8)
#     4. Runs all unit tests on Python 3.10, 3.11 and 3.12
#   If any step fails, the pull request is marked with a red X and,
#   with branch protection on main, it CANNOT be merged.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: ["**"]          # every commit, on every branch
  pull_request:
    branches: [main]          # every pull request into main
  workflow_dispatch:          # lets us start it by hand from the Actions tab

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # finish all versions even if one fails
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint with flake8
        run: flake8 .

      - name: Run unit tests
        run: python -m unittest -v

  # One summary check to require in branch protection.
  # It only passes if every Python version above passed.
  all-tests-passed:
    name: All tests passed
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Some tests failed. This change cannot be merged."
            exit 1
          fi
          echo "All tests passed on every Python version."
